<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        MyPortfolio
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <div class="container nav-content">

        <a
            href="{{ url_for('index') }}"
            class="brand"
        >
            MyPortfolio
        </a>

        <div class="nav-links">

            <a href="{{ url_for('index') }}">
                Home
            </a>

            <a href="{{ url_for('projects') }}">
                Projects
            </a>

            <a href="{{ url_for('blog') }}">
                Blog
            </a>

            <a href="{{ url_for('contact') }}">
                Contact
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</nav>

<main class="container">

    {% if message %}

    <div class="alert {{ status }}">
        {{ message }}
    </div>

    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<footer>

    <div class="container">

        <p>
            &copy; 2026 MyPortfolio.
            Built with Flask & DevSecOps.
        </p>

    </div>

</footer>

</body>
</html>
