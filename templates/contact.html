{% extends "base.html" %}

{% block title %}
Contact - MyPortfolio
{% endblock %}

{% block content %}

<section class="page-header">

    <p class="eyebrow">
        CONTACT
    </p>

    <h1>
        Hubungi Saya
    </h1>

    <p>
        Silakan kirim pesan melalui form berikut.
    </p>

</section>


<div class="form-card">

    <form
        method="POST"
        action="{{ url_for('contact') }}"
    >

        <div class="form-group">

            <label for="sender_name">
                Nama
            </label>

            <input
                type="text"
                id="sender_name"
                name="sender_name"
                required
            >

        </div>


        <div class="form-group">

            <label for="sender_email">
                Email
            </label>

            <input
                type="email"
                id="sender_email"
                name="sender_email"
                required
            >

        </div>


        <div class="form-group">

            <label for="message_body">
                Pesan
            </label>

            <textarea
                id="message_body"
                name="message_body"
                rows="6"
                required
            ></textarea>

        </div>


        <button
            type="submit"
            class="btn primary"
        >
            Kirim Pesan
        </button>

    </form>

</div>

{% endblock %}
