version: "3"
services:
  flask:
    build: .
    container_name: flask-app
    expose:
      - "5000"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    security_opt:
      - no-new-privileges:true
    read_only: true
